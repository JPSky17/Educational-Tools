function positionDragon(){
  const el = document.getElementById('bossDragon');
  if(!el || !activeBoss) return;
  el.style.left = BOSS_DRAGON_X + '%';
  el.style.top = ((activeBoss.lane+0.5)*(100/BOSS_LANES)) + '%';
}

function moveBossLane(delta){
  const b = activeBoss;
  if(!b || b.ended) return;
  b.lane = Math.max(0, Math.min(BOSS_LANES-1, b.lane+delta));
  positionDragon();
}

function positionEntity(el, x, lane){
  el.style.left = x + '%';
  el.style.top = ((lane+0.5)*(100/BOSS_LANES)) + '%';
}

function fireBossBlast(){
  const b = activeBoss;
  if(!b || b.ended) return;
  const arena = document.getElementById('bossArena');
  if(!arena) return;
  const fb = { lane:b.lane, x:BOSS_DRAGON_X+3, dead:false, el:null };
  const el = document.createElement('div');
  el.className = 'bossFireball';
  el.textContent = '🔥';
  arena.appendChild(el);
  fb.el = el;
  positionEntity(el, fb.x, fb.lane);
  b.fireballs.push(fb);
}

function bossKeyHandler(e){
  if(!activeBoss || activeBoss.ended) return;
  if(e.key === ' ' || e.code === 'Space' || e.key === 'Spacebar'){
    e.preventDefault();
    fireBossBlast();
    return;
  }
  const map = { ArrowUp:-1, ArrowDown:1, w:-1, s:1 };
  if(map[e.key] !== undefined){ e.preventDefault(); moveBossLane(map[e.key]); }
}

function ensureFourChoices(choices, answer){
  const set = new Set(choices);
  set.add(answer);
  let guard = 0;
  while(set.size < BOSS_LANES && guard < 60){
    guard++;
    const delta = 1 + Math.floor(Math.random()*6);
    const candidate = Math.random()<0.5 ? answer+delta : answer-delta;
    if(candidate>=0) set.add(candidate);
  }
  let result = shuffle([...set]).slice(0, BOSS_LANES);
  if(!result.includes(answer)) result[Math.floor(Math.random()*result.length)] = answer;
  return result;
}

function spawnBossProblem(){
  const b = activeBoss;
  if(!b || b.ended) return;
  const isl = islands[Math.floor(Math.random()*islands.length)];
  const level = Math.min(2, Math.floor(b.correctCount/4));
  const problem = isl.generator(level);
  const choices = ensureFourChoices(problem.choices.slice(), problem.answer);
  const laneOrder = shuffle([0,1,2,3]);

  const arena = document.getElementById('bossArena');
  arena.querySelectorAll('.bossTarget, .bossFireball').forEach(el=>el.remove());
  b.fireballs = [];
  b.targets = [];
  choices.forEach((val,i)=>{
    const lane = laneOrder[i];
    const t = { lane, value:val, correct: val===problem.answer, x:BOSS_SPAWN_X, hit:false, escaped:false, el:null };
    const el = document.createElement('div');
    el.className = 'bossTarget';
    el.innerHTML = `<span>${val}</span>`;
    arena.appendChild(el);
    t.el = el;
    positionEntity(el, t.x, lane);
    b.targets.push(t);
  });

  document.getElementById('bossPrompt').innerHTML =
    (problem.visualHtml ? `<div class="bossVisual">${problem.visualHtml}</div>` : '') +
    `<div class="bossPromptText">${problem.text.replace(/\n/g,'<br>')}</div>`;
}

function flashBossFeedback(good){
  const arena = document.getElementById('bossArena');
  if(!arena) return;
  arena.classList.remove('flash-good','flash-bad');
  void arena.offsetWidth;
  arena.classList.add(good ? 'flash-good' : 'flash-bad');
  setTimeout(()=>arena.classList.remove('flash-good','flash-bad'), 400);
}

function handleBossHit(target){
  const b = activeBoss;
  if(!b) return;
  if(target.correct){
    b.correctCount++;
    b.speed = BOSS_BASE_SPEED + b.correctCount*BOSS_SPEED_STEP;
    playSFX('hit');
    flashBossFeedback(true);
    updateBossStatus();
    if(b.correctCount >= BOSS_TARGET_CORRECT){ endBossRound(true); return; }
    b.targets.forEach(t2 => { if(!t2.hit && !t2.escaped && t2.el){ t2.hit = true; t2.el.remove(); } });
    b.targets = [];
    setTimeout(()=>{ if(activeBoss && !activeBoss.ended) spawnBossProblem(); }, 500);
  } else {
    b.lives--;
    b.misses++;
    playSFX('miss');
    flashBossFeedback(false);
    updateBossStatus();
    if(b.lives <= 0){ endBossRound(false); return; }
  }
}

function handleBossMiss(){
  const b = activeBoss;
  if(!b) return;
  b.lives--;
  b.misses++;
  playSFX('miss');
  flashBossFeedback(false);
  updateBossStatus();
  if(b.lives <= 0){ endBossRound(false); return; }
  b.targets.forEach(t2 => { if(!t2.hit && !t2.escaped && t2.el){ t2.escaped = true; t2.el.remove(); } });
  b.targets = [];
  setTimeout(()=>{ if(activeBoss && !activeBoss.ended) spawnBossProblem(); }, 400);
}

function bossTick(ts){
  const b = activeBoss;
  if(!b || b.ended) return;
  if(b.lastTs == null) b.lastTs = ts;
  const dt = Math.min(0.05, (ts-b.lastTs)/1000);
  b.lastTs = ts;

  b.targets.forEach(t=>{
    if(t.hit || t.escaped) return;
    t.x -= b.speed*dt;
    if(t.el) positionEntity(t.el, t.x, t.lane);
  });
  b.fireballs.forEach(f=>{
    if(f.dead) return;
    f.x += BOSS_FIREBALL_SPEED*dt;
    if(f.el) positionEntity(f.el, f.x, f.lane);
  });

  b.fireballs.forEach(f=>{
    if(f.dead) return;
    b.targets.forEach(t=>{
      if(t.hit || t.escaped || t.lane!==f.lane) return;
      if(Math.abs(f.x - t.x) < BOSS_HIT_RADIUS){
        f.dead = true;
        t.hit = true;
        if(t.el) t.el.remove();
        if(f.el) f.el.remove();
        handleBossHit(t);
      }
    });
  });
  b.fireballs = b.fireballs.filter(f=>{
    if(f.dead || f.x > 105){ if(f.el) f.el.remove(); return false; }
    return true;
  });

  b.targets.forEach(t=>{
    if(!t.hit && !t.escaped && t.x <= BOSS_DRAGON_X){
      t.escaped = true;
      if(t.el) t.el.remove();
      if(t.correct) handleBossMiss();
    }
  });

  if(activeBoss && !activeBoss.ended) activeBoss.rafId = requestAnimationFrame(bossTick);
}

function endBossRound(success){
  const b = activeBoss;
  if(!b || b.ended) return;
  b.ended = true;
  if(b.rafId) cancelAnimationFrame(b.rafId);
  document.removeEventListener('keydown', bossKeyHandler);
  document.querySelectorAll('.bossTarget, .bossFireball').forEach(el=>el.remove());

  const starsEarned = success ? 3 : (b.correctCount>=8 ? 2 : b.correctCount>=4 ? 1 : 0);
  const wasFirstClear = state.bossStars===0 && starsEarned>0;
  state.bossStars = Math.max(state.bossStars, starsEarned);
  state.bossBestHits = Math.max(state.bossBestHits||0, b.correctCount);

  const levelBefore = heroLevel();
  let xpGained = b.correctCount*12 + starsEarned*20;
  if(wasFirstClear) xpGained += 50;
  state.hero.totalXp += xpGained;
  const levelAfter = heroLevel();
  const leveledUp = levelAfter > levelBefore;
  const newGear = leveledUp ? GEAR_TABLE.filter(g => g.level > levelBefore && g.level <= levelAfter) : [];

  saveState();
  playSFX(success ? 'win' : 'lose');

  const panel = document.getElementById('questPanel');
  panel.classList.remove('bossActive');
  const starDisplay = [1,2,3].map(n => `<span class="${n<=starsEarned?'star-on':'star-off'}">★</span>`).join('');
  const headline = success ? 'The dragon triumphs! 🐉🔥' : 'Out of lives — the dragon needs to rest!';

  panel.innerHTML = `
    <button class="closeBtn" onclick="closeQuest()">✕</button>
    <div class="resultsArea">
      <div class="questBadge" style="background:linear-gradient(135deg,var(--coral),var(--gold)); margin:0 auto;">🐉</div>
      <h2>Dragon Rider Showdown</h2>
      <p style="font-weight:800;color:var(--ink);margin-top:4px;">${headline}</p>
      <p>${b.correctCount} correct hit${b.correctCount===1?'':'s'} of ${BOSS_TARGET_CORRECT}${b.misses ? ` · ${b.misses} miss${b.misses===1?'':'es'}` : ' · no misses!'}</p>
      <div class="bigStars">${starDisplay}</div>
      <div class="xpGainLine">
        <span style="font-weight:800;color:var(--gold)">+${xpGained} XP</span>
        <div class="xpGainBar"><div class="xpGainFill" id="xpGainFill"></div></div>
      </div>
      <div class="levelUpBanner" id="levelUpBanner">
        ⭐ Level up! ${state.hero.name} reached Level ${levelAfter}.
        ${newGear.length ? '<br>New gear unlocked: ' + newGear.map(g=>g.icon+' '+g.name).join(', ') : ''}
      </div>
      <button onclick="openBossMode()">🔁 ${success ? 'Play Again' : 'Try Again'}</button>
      <button onclick="closeQuest()" style="background:var(--indigo);margin-left:8px;">🗺️ Back to the Map</button>
    </div>
  `;

  requestAnimationFrame(() => {
    const fill = document.getElementById('xpGainFill');
    if(fill) fill.style.width = Math.min(100, Math.round((heroXpIntoLevel()/heroXpNeeded())*100)) + '%';
  });
  if(leveledUp){
    setTimeout(() => {
      const banner = document.getElementById('levelUpBanner');
      if(banner) banner.classList.add('show');
      playSFX('levelup');
    }, 500);
  }
  activeBoss = null;
}

/* ============ SKYFIRE FLIGHT ============ */
function ensureChoiceCount(choices, answer, count){
  const set = new Set(choices);
  set.add(answer);
  let guard = 0;
  while(set.size < count && guard < 80){
    guard++;
    const delta = 1 + Math.floor(Math.random()*6);
    const candidate = Math.random()<0.5 ? answer+delta : answer-delta;
    if(candidate>=0) set.add(candidate);
  }
  let result = shuffle([...set]).slice(0, count);
  if(!result.includes(answer)) result[Math.floor(Math.random()*result.length)] = answer;
  return result;
}

function openFlightMode(){
  activeQuest = { flight:true, standalone:true };
  document.getElementById('overlay').classList.add('show');
  activeFlight = {
    lives: FLIGHT_LIVES,
    correctCount: 0,

    speed: FLIGHT_BASE_SPEED,
    debris: [],
    ended: false,
    rafId: null,
    lastTs: null
  };
  renderFlightShell();
  document.addEventListener('keydown', flightKeyHandler);
  activeFlight.rafId = requestAnimationFrame(flightTick);
  spawnFlightProblem();
}

function flightHeartsHtml(){
  return Array.from({length:FLIGHT_LIVES}).map((_,i)=> i<activeFlight.lives ? '❤️' : '🖤').join('');
}
function updateFlightStatus(){

function positionForDepth(depth, ox, oy){
  const t = Math.min(1, depth/100);
  const scale = 0.2 + t*1.05;
  const left = 50 + ox*(6 + t*36);
  const top = 28 + t*56 + oy*(3 + t*13);
  return { left, top, scale };
}

function positionDebrisEl(el, depth, ox, oy, valEl){
  const p = positionForDepth(depth, ox, oy);
  el.style.left = p.left + '%';
  el.style.top = p.top + '%';
  el.style.transform = `translate(-50%,-50%) scale(${p.scale})`;
  el.style.zIndex = String(2 + Math.round(p.scale*10));
  if(valEl){
    // grow the number itself beyond the icon's own scaling, so the value is
    // clearly bigger and easier to read the closer the debris gets
    const t = Math.min(1, depth/100);
    valEl.style.fontSize = (12 + t*18) + 'px';
    valEl.style.padding = `${1 + t*2}px ${7 + t*5}px`;
  }
}

const FLIGHT_DEBRIS_EMOJI = ['🦅','🦉','🦇','🦋','🐝']; // eagle & owl kept from the muncher set, rest swapped for other flying critters

// Skyfire Flight draws from every kingdom except Counting Cove — its "how many"
// picture-counting questions don't translate well to the fast-paced flight format.
const FLIGHT_ISLANDS = islands.filter(isl => isl.id !== 'counting-cove');

function spawnFlightProblem(){
  const b = activeFlight;
  if(!b || b.ended) return;
  const level = Math.min(2, Math.floor(b.correctCount/4));
  let isl, problem, guard = 0;
  do {
    isl = FLIGHT_ISLANDS[Math.floor(Math.random()*FLIGHT_ISLANDS.length)];
    problem = isl.generator(level);
    guard++;
    // Fraction Forest's "ranger planted trees" question is a random sub-branch of
    // its generator (not a whole island), so skip it by re-rolling rather than
    // filtering islands.
  } while(/ranger planted/.test(problem.text) && guard < 15);
  const choices = ensureChoiceCount(problem.choices.slice(), problem.answer, FLIGHT_DEBRIS_COUNT);
  const quadrants = shuffle([{ox:-1,oy:-0.7},{ox:1,oy:-0.7},{ox:-1,oy:0.7},{ox:1,oy:0.7}]);

  const arena = document.getElementById('flightArena');
  arena.querySelectorAll('.flightDebris, .flightFlame').forEach(el=>el.remove());
  b.debris = [];
  choices.forEach((val,i)=>{
    const q = quadrants[i % quadrants.length];
    const d = { value:val, correct: val===problem.answer, depth:0, ox:q.ox, oy:q.oy, hit:false, escaped:false, el:null, valEl:null };
    const el = document.createElement('div');
    el.className = 'flightDebris';
    const emoji = FLIGHT_DEBRIS_EMOJI[Math.floor(Math.random()*FLIGHT_DEBRIS_EMOJI.length)];
    el.innerHTML = `<span class="flightDebrisRock" style="font-size:30px;">${emoji}</span><span class="flightDebrisVal">${val}</span>`;
    arena.appendChild(el);
    d.el = el;
    d.valEl = el.querySelector('.flightDebrisVal');
    positionDebrisEl(el, d.depth, d.ox, d.oy, d.valEl);
    b.debris.push(d);
  });

  document.getElementById('flightPrompt').innerHTML =
    (problem.visualHtml ? `<div class="bossVisual">${problem.visualHtml}</div>` : '') +
    `<div class="flightPromptText">${problem.text.replace(/\n/g,'<br>')}</div>`;
  const input = document.getElementById('flightInput');
  if(input){ input.value=''; input.focus(); }
}

function flashFlightFeedback(kind){
  const arena = document.getElementById('flightArena');
  if(!arena || kind==='none') return;
  arena.classList.remove('flash-good','flash-bad');
  void arena.offsetWidth;
  arena.classList.add(kind==='good' ? 'flash-good' : 'flash-bad');
  setTimeout(()=>arena.classList.remove('flash-good','flash-bad'), 400);
}

function fireFlightBreath(){
  const b = activeFlight;
  if(!b || b.ended) return;
  const input = document.getElementById('flightInput');
  if(!input) return;
  const raw = input.value.trim();
  input.value = '';
  input.focus();
  if(raw === '') return;
  const typed = Number(raw);
  if(!Number.isFinite(typed)) return;
  const candidates = b.debris.filter(d => !d.hit && !d.escaped && d.value===typed);
  if(candidates.length === 0){
    flashFlightFeedback('none');
    return;
  }
  candidates.sort((x,y)=>y.depth-x.depth); // burn the nearest/most urgent match first
  spawnFlame(candidates[0]);
}

function spawnFlame(target){
  const arena = document.getElementById('flightArena');
  if(!arena) return;
  const pos = positionForDepth(target.depth, target.ox, target.oy);
  target.hit = true;
  if(target.el){ target.el.remove(); target.el = null; }

  const flame = document.createElement('div');
  flame.className = 'flightFlame';
  flame.textContent = '🔥';
  flame.style.left = '50%';
  flame.style.top = '90%';
  flame.style.transform = 'translate(-50%,-50%) scale(0.6)';
  flame.style.opacity = '1';
  arena.appendChild(flame);
  void flame.offsetWidth;
  flame.style.left = pos.left + '%';
  flame.style.top = pos.top + '%';
  flame.style.transform = `translate(-50%,-50%) scale(${pos.scale*1.1})`;

  setTimeout(()=>{
    flame.style.opacity = '0';
    setTimeout(()=>{ if(flame.parentNode) flame.remove(); }, 220);
    resolveFlightHit(target);
  }, FLIGHT_FLAME_MS);
}

function resolveFlightHit(target){
  const b = activeFlight;
  if(!b) return;
  if(target.correct){
    b.correctCount++;
    b.speed = FLIGHT_BASE_SPEED + b.correctCount*FLIGHT_SPEED_STEP;
    playSFX('hit');
    flashFlightFeedback('good');
    updateFlightStatus();
    if(b.correctCount >= FLIGHT_TARGET_CORRECT){ endFlightRound(true); return; }
    b.debris.forEach(d => { if(!d.hit && !d.escaped && d.el){ d.hit = true; d.el.remove(); d.el = null; } });
    b.debris = [];
    setTimeout(()=>{ if(activeFlight && !activeFlight.ended) spawnFlightProblem(); }, 500);
  } else {
    b.lives--;
    b.misses++;
    playSFX('miss');
    flashFlightFeedback('bad');
    updateFlightStatus();
    if(b.lives <= 0){ endFlightRound(false); return; }
  }
}

function handleFlightMiss(){
  const b = activeFlight;
  if(!b) return;
  b.lives--;
  b.misses++;
  playSFX('miss');
  flashFlightFeedback('bad');
  updateFlightStatus();
  if(b.lives <= 0){ endFlightRound(false); return; }
  b.debris.forEach(d => { if(!d.hit && !d.escaped && d.el){ d.escaped = true; d.el.remove(); d.el = null; } });
  b.debris = [];
  setTimeout(()=>{ if(activeFlight && !activeFlight.ended) spawnFlightProblem(); }, 400);
}

function flightKeyHandler(e){
  if(!activeFlight || activeFlight.ended) return;
  if(e.key === 'Enter'){
    const input = document.getElementById('flightInput');
    if(document.activeElement !== input){ e.preventDefault(); fireFlightBreath(); }
  }
}

function flightTick(ts){
  const b = activeFlight;
  if(!b || b.ended) return;
  if(b.lastTs == null) b.lastTs = ts;
  const dt = Math.min(0.05, (ts-b.lastTs)/1000);
  b.lastTs = ts;

  b.debris.forEach(d=>{
    if(d.hit || d.escaped) return;
    d.depth += b.speed*dt;
    if(d.el) positionDebrisEl(d.el, d.depth, d.ox, d.oy, d.valEl);
  });

  b.debris.forEach(d=>{
    if(!d.hit && !d.escaped && d.depth >= FLIGHT_HIT_DEPTH){
      d.escaped = true;
      if(d.el){ d.el.remove(); d.el = null; }
      if(d.correct) handleFlightMiss();
    }
  });

  if(activeFlight && !activeFlight.ended) activeFlight.rafId = requestAnimationFrame(flightTick);
}

function endFlightRound(success){
  const b = activeFlight;
  if(!b || b.ended) return;
  b.ended = true;
  if(b.rafId) cancelAnimationFrame(b.rafId);
  document.removeEventListener('keydown', flightKeyHandler);
  document.querySelectorAll('.flightDebris, .flightFlame').forEach(el=>el.remove());

  const starsEarned = success ? 3 : (b.correctCount>=8 ? 2 : b.correctCount>=4 ? 1 : 0);
  const wasFirstClear = state.flightStars===0 && starsEarned>0;
  state.flightStars = Math.max(state.flightStars, starsEarned);
  state.flightBestHits = Math.max(state.flightBestHits||0, b.correctCount);

  const levelBefore = heroLevel();
  let xpGained = b.correctCount*12 + starsEarned*20;
  if(wasFirstClear) xpGained += 50;
  state.hero.totalXp += xpGained;
  const levelAfter = heroLevel();
  const leveledUp = levelAfter > levelBefore;
  const newGear = leveledUp ? GEAR_TABLE.filter(g => g.level > levelBefore && g.level <= levelAfter) : [];

  // Skyfire Flight is the last stop in the whole adventure, so the very first
  // time it's actually won (not just attempted), show a one-time ending
  // cutscene before the normal results screen. Replays after that go
  // straight to results — the ending is a moment, not a repeat interruption.
  const isFinalVictory = success && !state.flightBeaten;
  if(success) state.flightBeaten = true;

  saveState();

  const resultsData = { success, b, starsEarned, xpGained, levelAfter, leveledUp, newGear };
  if(isFinalVictory){
    renderFlightVictoryScene(resultsData);
  } else {
    renderFlightResultsScreen(resultsData);
  }
  activeFlight = null;
}

function renderFlightResultsScreen(data){
  const { success, b, starsEarned, xpGained, levelAfter, leveledUp, newGear } = data;
  playSFX(success ? 'win' : 'lose');

  const headline = success ? 'Sky cleared — nicely flown! 🔥🐉' : 'Out of lives — time to land and recover!';

  panel.innerHTML = `

    <div class="resultsArea">

      <h2>Skyfire Flight</h2>

      <p>${b.correctCount} correct hit${b.correctCount===1?'':'s'} of ${FLIGHT_TARGET_CORRECT}${b.misses ? ` · ${b.misses} miss${b.misses===1?'':'es'}` : ' · no misses!'}</p>

        ${newGear.length ? '<br>New gear unlocked: ' + newGear.map(g=>g.icon+' '+g.name).join(', ') : ''}
      </div>
      <button onclick="openFlightMode()">🔁 ${success ? 'Play Again' : 'Try Again'}</button>
      <button onclick="closeQuest()" style="background:var(--indigo);margin-left:8px;">🗺️ Back to the Map</button>
    </div>
  `;

  requestAnimationFrame(() => {
    const fill = document.getElementById('xpGainFill');
    if(fill) fill.style.width = Math.min(100, Math.round((heroXpIntoLevel()/heroXpNeeded())*100)) + '%';

  if(leveledUp){
    setTimeout(() => {
      const banner = document.getElementById('levelUpBanner');
      if(banner) banner.classList.add('show');
      playSFX('levelup');
    }, 500);
  }

// One-time ending cutscene: the dragon carries the hero off the sky-battle
// and glides into a treasure cave glittering with gold. Plays once, the
// first time Skyfire Flight is actually won, then hands off to the normal
// results screen (auto-advances, but can also be skipped with a tap).
let pendingFlightResults = null;
// Simple Web Audio fanfare for the ending cutscene — no external assets,
// wrapped defensively since some browsers restrict audio until a user
// gesture (the flight round ending is itself triggered by the player's own
// key presses, so this call chain already has one).
// Shared Web Audio setup for all sound effects in the game (Muncher, Dragon
// Rider Showdown, Skyfire Flight, and the ending cutscene). One AudioContext
// is created lazily on first use and reused — creating a fresh context for
// every chomp/hit during fast-paced play would be wasteful and can cause
// audio glitches. Everything is wrapped defensively since some browsers
// restrict audio until a user gesture, and this should never break gameplay
// if it's unavailable.
function getAudioCtx(){
  if(!window.__nlAudioCtx){
    try{
      const AudioCtx = window.AudioContext || window.webkitAudioContext;
      if(AudioCtx) window.__nlAudioCtx = new AudioCtx();
    }catch(e){}
  }
  return window.__nlAudioCtx || null;
}
function playTone(freq, opts){
  opts = opts || {};
  try{
    const ctx = getAudioCtx();
    if(!ctx) return;
    const type = opts.type || 'sine';
    const duration = opts.duration != null ? opts.duration : 0.18;
    const volume = opts.volume != null ? opts.volume : 0.14;
    const delay = opts.delay || 0;
    const glideTo = opts.glideTo || null;
    const osc = ctx.createOscillator();
    const gain = ctx.createGain();
    osc.type = type;
    const start = ctx.currentTime + delay;
    osc.frequency.setValueAtTime(freq, start);
    if(glideTo) osc.frequency.exponentialRampToValueAtTime(glideTo, start + duration);
    gain.gain.setValueAtTime(0, start);
    gain.gain.linearRampToValueAtTime(volume, start + 0.012);
    gain.gain.exponentialRampToValueAtTime(0.001, start + duration);
    osc.connect(gain).connect(ctx.destination);
    osc.start(start);
    osc.stop(start + duration + 0.03);
  }catch(e){}
}
function playChime(notes, type){
  notes.forEach((freq, i) => playTone(freq, { type: type || 'triangle', duration: 0.55, volume: 0.16, delay: i*0.14 }));
}
// Named sound-effect presets shared across Number Muncher, the Dragon Rider
// Showdown, and Skyfire Flight, so each game feels consistent without
// duplicating oscillator code everywhere it's needed.
function playSFX(name){
  switch(name){
    case 'correct': // munching a correct number / a good answer
      playTone(880, { type:'sine', duration:0.13, volume:0.15 });
      playTone(1318.5, { type:'sine', duration:0.18, volume:0.13, delay:0.07 });
      break;
    case 'wrong': // munching a wrong number
      playTone(220, { type:'sawtooth', duration:0.22, volume:0.11, glideTo:140 });
      break;
    case 'hit': // a correct hit in the boss fight or flight
      playTone(660, { type:'triangle', duration:0.09, volume:0.15 });
      playTone(990, { type:'triangle', duration:0.15, volume:0.13, delay:0.05 });
      break;
    case 'miss': // a wrong hit, an escaped target, or taking damage
      playTone(160, { type:'sawtooth', duration:0.22, volume:0.15, glideTo:80 });
      break;
    case 'caught': // a Muncher enemy catches the player
      playTone(300, { type:'square', duration:0.11, volume:0.13 });
      playTone(180, { type:'square', duration:0.17, volume:0.13, delay:0.09 });
      break;
    case 'win': // clearing a round
      [523.25, 659.25, 783.99, 1046.5].forEach((f,i) => playTone(f, { type:'triangle', duration:0.32, volume:0.15, delay:i*0.1 }));
      break;
    case 'lose': // running out of lives
      [392, 329.63, 261.63].forEach((f,i) => playTone(f, { type:'sine', duration:0.3, volume:0.12, delay:i*0.15 }));
      break;
    case 'levelup': // hero gains a level — a brighter, sparklier flourish than a plain round win
      [659.25, 830.61, 987.77, 1318.5, 1567.98].forEach((f,i) => playTone(f, { type:'sine', duration:0.28, volume:0.13, delay:i*0.08 }));
      break;
  }
}

      <path d="M-9 2 Q-15 5 -13 -1 Q-10 -3 -8 0 Z" fill="#3FBE72" stroke="#1f4d33" stroke-width="1.1" stroke-linejoin="round"/>

}

function renderFlightVictoryScene(resultsData){
  pendingFlightResults = resultsData;
  const heroLvl = heroLevel();
  const panel = document.getElementById('questPanel');
  panel.classList.remove('flightActive');
  panel.classList.add('victorySceneActive');

  const totalStars = Object.values(state.stars).reduce((a,b)=>a+b,0) + state.bossStars + state.flightStars;
  const kingdomsCleared = Object.values(state.stars).filter(s=>s>=STARS_TO_UNLOCK).length;

  const confettiSpec = [
    ['🪙',8,0], ['✨',18,0.1], ['🪙',30,0.2], ['💎',42,0.05], ['🪙',55,0.25],
    ['✨',67,0.15], ['💎',78,0.3], ['🪙',88,0.1]
  ];
  const confettiHtml = confettiSpec.map(([emoji,left,delay]) =>
    `<span style="left:${left}%;animation-delay:${3.15+delay}s;">${emoji}</span>`
  ).join('');

  panel.innerHTML = `
    <div class="victoryScene" id="victoryScene">
      <div class="victorySky"></div>
      <div class="victoryCloud" style="left:10%;top:20%;">☁️</div>
      <div class="victoryCloud" style="left:26%;top:44%;font-size:15px;animation-delay:1.5s;">☁️</div>
      <div class="victoryTwinkle" style="left:14%;top:12%;animation-delay:.2s;">✦</div>
      <div class="victoryTwinkle" style="left:22%;top:34%;animation-delay:1s;">✦</div>
      <div class="victoryTwinkle" style="left:6%;top:48%;animation-delay:.6s;">✦</div>
      <div class="victoryMountainWrap">${victoryMountainSVG()}</div>
      <div class="victoryGlow"></div>
      <div class="victoryShockwave"></div>
      <div class="victoryTreasurePile">
        <span style="left:6%;">💰</span>
        <span style="left:34%;">🪙</span>
        <span style="left:58%;">💎</span>
        <span style="left:80%;">🪙</span>
        <span style="left:20%;top:6px;">👑</span>
        <span style="left:66%;top:2px;">💎</span>
      </div>
      <div class="victoryConfetti">${confettiHtml}</div>
      <div class="victorySparkle" style="left:62%;top:30%;">✨</div>
      <div class="victorySparkle" style="left:74%;top:52%;animation-delay:.25s;">✨</div>
      <div class="victorySparkle" style="left:52%;top:58%;animation-delay:.5s;">✨</div>
      <div class="victoryFlyer" id="victoryFlyer">
        ${victoryDragonMountSVG()}
        <div class="victoryRider">${avatarSVG(state.hero.name, heroLvl, 26)}</div>
      </div>
      <div class="victoryTitle">
        <h2>🎉 The Dragon's Treasure! 🎉</h2>
        <p>${state.hero.name} and their dragon found the kingdom's hidden gold!</p>
        <span class="victoryStats">Level ${heroLvl} · ${totalStars}★ earned · ${kingdomsCleared}/${islands.length} Kingdoms cleared</span>
      </div>
      <button class="victoryContinueBtn" onclick="continueFromVictoryScene()">Continue ✨</button>
    </div>
  `;

  playChime([523.25, 659.25, 783.99], 'triangle');
  clearTimeout(window.__victoryArrivalSoundTimer);
  window.__victoryArrivalSoundTimer = setTimeout(() => playChime([1046.5, 1318.5], 'sine'), 3050);

  clearTimeout(window.__victorySceneTimer);
  window.__victorySceneTimer = setTimeout(() => {
    if(pendingFlightResults) continueFromVictoryScene();
  }, 7800);
}
function continueFromVictoryScene(){
  clearTimeout(window.__victorySceneTimer);
  clearTimeout(window.__victoryArrivalSoundTimer);
  if(!pendingFlightResults) return;
  const data = pendingFlightResults;
  pendingFlightResults = null;
  renderFlightResultsScreen(data);
}

/* ============ INIT ============ */
(async function init(){
  await loadState();
  renderMap();
})();
</script>
